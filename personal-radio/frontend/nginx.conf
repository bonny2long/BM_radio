worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $uri $cache_policy {
        default "no-cache";
        "/" "no-cache, must-revalidate";
        "/index.html" "no-cache, must-revalidate";
        ~^/assets/ "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Cache-Control $cache_policy always;

        if ($request_uri ~* "(\.\./|%2e%2e|%252e%252e)") {
            return 400;
        }

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # Backend policy/path checks authorize audiobook requests first. This
        # internal-only location then serves the validated read-only file with
        # Nginx range handling; clients cannot request it directly.
        location ^~ /__bm_audiobooks/ {
            internal;
            alias /media/Audiobooks/Library/;
            sendfile on;
        }

        # Backend cover, artwork, and stream routes are all under /api/media.
        # No URI suffix is supplied on proxy_pass, preserving the complete /api path.
        location ^~ /api/ {
            proxy_pass http://backend:8094;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        location ~ (^|/)\. {
            return 404;
        }

        location /assets/ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
